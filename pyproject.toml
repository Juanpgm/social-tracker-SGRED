[project]
name = "social-tracker"
version = "0.1.0"
description = "Social risk monitor: tracks social-media signals and surfaces risk."
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "PyYAML",
    "typer",
    "uvicorn>=0.54.0",
]

[project.scripts]
social-tracker = "social_tracker.entrypoints.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "import-linter",
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-browser checks (Playwright + Chromium) are opt-in: `uv run pytest -m browser`.
addopts = "-ra -m 'not browser'"
markers = ["browser: drives the web UI in a real Chromium (opt in with -m browser)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]
