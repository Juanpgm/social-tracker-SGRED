[project]
name = "social-tracker"
version = "0.1.0"
description = "Social risk monitor: tracks social-media signals and surfaces risk."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "PyYAML",
    "typer",
]

[project.scripts]
social-tracker = "social_tracker.entrypoints.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]
